basert.chat:
  method: POST
  url: http://127.0.0.1:8453/v1/chat/completions
  headers:
    Content-Type: application/json
  body: |
    {
      "messages": [{"role": "system", "content": "$SYSTEM_PROMPT"}, {"role": "user", "content": "$!PROMPT"}]
    }
  jq: .choices[0].message.content
  help: basert serve --model google/gemma-4-E2B-it --max-context 8192 --max-tokens 512 --prefix-cache
catfact.getFact:
  url: https://catfact.ninja/fact
  method: GET
  headers: {}
  jq: .fact
  help: Fetch a random cat fact.
celeris.chat:
  url: https://inference.celeris.ai/celeris-1-magnus/v1/chat/completions
  method: POST
  stream: true
  headers:
    Content-Type: application/json
    Authorization: "Bearer $!CELERIS_API_KEY"
  body: |
    {
      "model": "celeris-1-magnus",
      "messages": [{"role": "system", "content": "$SYSTEM_PROMPT"}, {"role": "user", "content": "$!PROMPT"}]
    }
  stream_jq: .choices[0].delta.content // .choices[0].delta.reasoning // empty
  jq: .choices[0].message.content
  help: Create a Celeris AI chat completion using celeris-1-magnus. Requires CELERIS_API_KEY and PROMPT.
celeris.models:
  url: https://inference.celeris.ai/celeris-1-magnus/v1/models
  headers:
    Authorization: "Bearer $!CELERIS_API_KEY"
  jq: .data[].id
  help: List available Celeris models. Requires CELERIS_API_KEY.
cerebras.chat:
  url: https://api.cerebras.ai/v1/chat/completions
  method: POST
  headers:
    Content-Type: application/json
    Authorization: "Bearer $!CEREBRAS_API_KEY"
  body: |
    {
      "model": "$!CEREBRAS_MODEL",
      "messages": [{"role": "system", "content": "$SYSTEM_PROMPT"}, {"role": "user", "content": "$!PROMPT"}]
    }
  jq: .choices[0].message.content
  help: Create a Cerebras chat completion. Requires CEREBRAS_API_KEY, CEREBRAS_MODEL, and PROMPT.
cerebras.models:
  url: https://api.cerebras.ai/public/v1/models
cloudflare.r2Download:
  url: https://api.cloudflare.com/client/v4/accounts/$!CLOUDFLARE_ACCOUNT_ID/r2/buckets/$!CLOUDFLARE_BUCKET/objects/$!FILE_NAME
  method: GET
  headers:
    Authorization: Bearer $!CLOUDFLARE_API_KEY
  output: $!FILE_PATH
  help: Download a Cloudflare R2 object to FILE_PATH. Requires CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_BUCKET, CLOUDFLARE_API_KEY, FILE_NAME, and FILE_PATH.
cloudflare.r2Upload:
  url: https://api.cloudflare.com/client/v4/accounts/$!CLOUDFLARE_ACCOUNT_ID/r2/buckets/$!CLOUDFLARE_BUCKET/objects/$!FILE_NAME
  method: PUT
  headers:
    Authorization: Bearer $!CLOUDFLARE_API_KEY
  file: $!FILE
  help: Upload a file to Cloudflare R2. Requires CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_BUCKET, CLOUDFLARE_API_KEY, FILE_NAME, and FILE.
discord.channelpost:
  url: https://discord.com/api/v10/channels/$!DISCORD_CHANNEL_ID/messages
  method: POST
  headers:
    Content-Type: application/json
    Authorization: "Bot $!DISCORD_BOT_TOKEN"
  body: |
    { "content": "$!POST" }
  help: |
    Post a message to a channel using the bot token (not a webhook).
    Requires DISCORD_CHANNEL_ID and DISCORD_BOT_TOKEN. Grab the channel ID by
    enabling Developer Mode in Discord and right-clicking the channel.
discord.gateway:
  url: wss://gateway.discord.gg?v=10&encoding=json
  body: |
    { "op": 2, "d": { "token": "$!DISCORD_BOT_TOKEN", "intents": 33281, "properties": { "os": "macos", "browser": "apicat", "device": "apicat" } } }
  capture:
    sequence: .s // empty
    heartbeat_interval: if .d.heartbeat_interval? then (.d.heartbeat_interval / 1000) else empty end
  keep_alive:
    interval: $heartbeat_interval
    send:
      op: 1
      d: $sequence
    expect:
      op: 11
    timeout: 10
  reconnect:
    enabled: true
    initial: 1
    maximum: 60
    multiplier: 2
    jitter: 0.2
  jq: 'select(.t == "MESSAGE_CREATE" and .d.author.bot != true) | .d.content'
  help: |
    Connect to the Discord WebSocket gateway and identify. Requires DISCORD_BOT_TOKEN.
    Set intents (513 = guilds+members) as needed; responses are streamed via onMessage.
discord.postwebhook:
  url: $!DISCORD_WEBHOOK_URL
  method: POST
  headers:
    Content-Type: application/json
  body: |
   { "content": "$!POST" }
  help: Discord Server Settings to create the Webhook URL, it should be in env var DISCORD_WEBHOOK_URL
echo.ws:
  url: wss://echo-websocket.fly.dev/.ws
  body: $!PROMPT
  help: Send PROMPT to an echo WebSocket.
github.prClose:
  url: https://api.github.com/repos/$!REPO/pulls/$!NUMBER
  method: PATCH
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
    Content-Type: application/json
  body: |
    { "state": "closed" }
  jq: .state
  help: Close PR NUMBER in REPO (owner/repo) without merging. Requires GITHUB_TOKEN, REPO, and NUMBER.
github.prComment:
  url: https://api.github.com/repos/$!REPO/issues/$!NUMBER/comments
  method: POST
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
    Content-Type: application/json
  body: |
    { "body": "$!BODY" }
  jq: .html_url
  help: Comment on PR NUMBER in REPO (owner/repo). Requires GITHUB_TOKEN, REPO, NUMBER, and BODY.
github.prComments:
  url: https://api.github.com/repos/$!REPO/pulls/$!NUMBER/comments
  method: GET
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
  jq: |
    .[] | "\(.user.login)\t\(.created_at)\t\(.path):\(.line // .original_line // "")\t\(.body)"
  help: List inline review comments on PR NUMBER in REPO (owner/repo). Requires GITHUB_TOKEN, REPO, and NUMBER.
github.prDiff:
  url: https://api.github.com/repos/$!REPO/pulls/$!NUMBER
  method: GET
  headers:
    Accept: application/vnd.github.v3.diff
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
  help: Print the raw unified diff of PR NUMBER in REPO (owner/repo). Requires GITHUB_TOKEN, REPO, and NUMBER. No jq; output is the diff text.
github.prFiles:
  url: https://api.github.com/repos/$!REPO/pulls/$!NUMBER/files
  method: GET
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
  jq: |
    .[] | "\(.status)\t+\(.additions)/-\(.deletions)\t\(.filename)"
  help: List changed files in PR NUMBER in REPO (owner/repo). Requires GITHUB_TOKEN, REPO, and NUMBER.
github.prGet:
  url: https://api.github.com/repos/$!REPO/pulls/$!NUMBER
  method: GET
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
  jq: |
    "\(.user.login)\t\(.state)\t\(.title)\n\n\(.body // "")"
  help: "Read PR NUMBER in REPO (owner/repo): author, state, title, and body. Requires GITHUB_TOKEN, REPO, and NUMBER."
github.prList:
  url: https://api.github.com/repos/$!REPO/pulls?state=$STATE
  method: GET
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
  jq: |
    .[] | "\(.number)\t\(.state)\t\(.user.login)\t\(.title)"
  help: |
    List pull requests in REPO (owner/repo). Requires GITHUB_TOKEN and REPO.
    Optional STATE: open (default), closed, or all.
github.prMerge:
  url: https://api.github.com/repos/$!REPO/pulls/$!NUMBER/merge
  method: PUT
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
    Content-Type: application/json
  jq: .merged
  help: |
    Merge PR NUMBER in REPO (owner/repo) using the repo's default merge method.
    Requires GITHUB_TOKEN, REPO, and NUMBER.
github.prReview:
  url: https://api.github.com/repos/$!REPO/pulls/$!NUMBER/reviews
  method: POST
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
    Content-Type: application/json
  body: |
    { "event": "$!EVENT", "body": "$!BODY" }
  jq: .html_url
  help: |
    Submit a review on PR NUMBER in REPO (owner/repo). Requires GITHUB_TOKEN, REPO, NUMBER, EVENT, and BODY.
    EVENT is one of APPROVE, REQUEST_CHANGES, or COMMENT.
github.prReviews:
  url: https://api.github.com/repos/$!REPO/pulls/$!NUMBER/reviews
  method: GET
  headers:
    Accept: application/vnd.github+json
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: Bearer $!GITHUB_TOKEN
  jq: |
    .[] | "\(.user.login)\t\(.state)\t\(.submitted_at)\t\(.body // "")"
  help: List reviews left on PR NUMBER in REPO (owner/repo). Requires GITHUB_TOKEN, REPO, and NUMBER.
httpbin.get:
  url: https://httpbin.org/get
  method: GET
  headers: {}
  help: Send a GET request to httpbin.org/get.
inception.chat:
  url: https://api.inceptionlabs.ai/v1/chat/completions
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer $!INCEPTION_API_KEY
  body: |
    {
      "model": "mercury-2.5",
      "messages": [{"role": "system", "content": "$SYSTEM_PROMPT"}, {"role": "user", "content": "$!PROMPT"}]
    }
  jq: .choices[0].message.content
  help: Inception AI chat completion using flagship Mercury 2.5. Requires INCEPTION_API_KEY and PROMPT.
inception.models:
  url: https://api.inceptionlabs.ai/v1/models
  headers:
    Authorization: Bearer $!INCEPTION_API_KEY
  jq: |
    (["Model","Context","Max Output","Prompt $/1M","Completion $/1M"],
     ([.data[] | [.id, (.context_length|tostring), (.max_output_length|tostring),
       ((((.pricing.prompt|tonumber)*1000000*100|round)/100)|tostring),
       ((((.pricing.completion|tonumber)*1000000*100|round)/100)|tostring)]]
      | sort_by(.[0])
      | .[]))
    | @tsv
  help: List Inception AI models with context length, max output, and per-1M token pricing. Requires INCEPTION_API_KEY.
mlx.chat:
  url: http://localhost:8080/v1/chat/completions
  method: POST
  headers:
    Content-Type: application/json
  body: |
    { 
      "model": "$!MLX_MODEL",
      "messages": [{"role": "user", "content": "$!PROMPT"}],
      "temperature": 0.7
    }
  jq: .choices[0].message.content
  help: Start server mlx_lm.server
mlx.localmodels:
  url: http://localhost:8080/v1/models
  jq: .data[].id
mlx.models:
  url: https://huggingface.co/api/models?author=mlx-community
  jq: .[].id
  help: Mlx tagged models on Huggingface. Not guaranteed to work on mlx but try it.
ollama.chat:
  method: POST
  url: http://localhost:11434/api/chat
  headers:
    Content-Type: application/json
  body: |
    {
      "model": "$!OLLAMA_MODEL",
      "messages": [{"role": "system", "content": "$SYSTEM_PROMPT"}, {"role": "user", "content": "$!PROMPT"}],
      "think": false,
      "stream": false
    }
  jq: .message.content
  help: Generate a response from a local Ollama server. Requires MODEL and PROMPT.
ollama.localmodels:
  url: http://localhost:11434/api/tags
  method: GET
  help: List models available from a local Ollama server.
openai.models:
  url: https://api.openai.com/v1/models
  headers:
    Content-Type: application/json
    Authorization: Bearer $!OPENAI_API_KEY
  jq: .data[].id
openai.chat:
  url: https://api.openai.com/v1/chat/completions
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer $!OPENAI_API_KEY
  body: |
    {
      "model": "$!OPENAI_MODEL",
      "messages": [{"role": "system", "content": "$SYSTEM_PROMPT"}, {"role": "user", "content": "$!PROMPT"}],
      "think": false,
      "stream": false
    }
  help: Create an OpenAI-compatible chat completion. Requires OPENAI_URL, OPENAI_API_KEY, MODEL, and PROMPT.
openrouter.chat:
  url: https://openrouter.ai/api/v1/chat/completions
  method: POST
  headers:
    Authorization: "Bearer $!OPENROUTER_API_KEY"
  body: |
    {
      "model": "$!OPENROUTER_MODEL",
      "messages": [{"role": "user", "content": "$OPTIONAL_PROMPT"}, {"role": "user", "content": "$!PROMPT"}]
      , "provider": {"order": ["$PROVIDER"]}
    }
  jq: .choices[0].message.content
  help: Create an OpenRouter chat completion. Requires OPENROUTER_API_KEY, OPENROUTER_MODEL, and PROMPT.
openrouter.credits:
  url: https://openrouter.ai/api/v1/credits
  headers:
    Authorization: "Bearer $!OPENROUTER_MANAGEMENT_API_KEY"
openrouter.key:
  url: https://openrouter.ai/api/v1/key
  headers:
    Authorization: "Bearer $!OPENROUTER_API_KEY"
  jq: |
    def f2: tonumber*100 | round/100 | tostring;
    (["field","value"],
     ([["label",.data.label],
       ["limit",(.data.limit // "unlimited" | if . == "unlimited" then . else f2 end)],
       ["limit_remaining",(.data.limit_remaining // "unlimited" | if . == "unlimited" then . else f2 end)],
       ["usage",(.data.usage // 0 | f2)],
       ["usage_today",(.data.usage_daily // 0 | f2)],
       ["usage_week",(.data.usage_weekly // 0 | f2)],
       ["usage_month",(.data.usage_monthly // 0 | f2)],
       ["free_tier",(.data.is_free_tier // false | tostring)]]
      | .[]))
    | @tsv
  help: Show current OpenRouter API key credits, usage, and limits. Requires OPENROUTER_API_KEY.
openrouter.endpoints:
  url: https://openrouter.ai/api/v1/models/$!MODEL/endpoints
openrouter.models:
  url: https://openrouter.ai/api/v1/models
  jq: |
    def pad: tostring | if length==1 then "00"+. elif length==2 then "0"+. else . end;
    def f3: (. * 1000 | round) as $m | (($m/1000)|floor) as $i | ($m % 1000) as $f | "\($i).\($f|pad)";
    (["Model","Input/1M","Output/1M","Cached/1M"],
     ([.data[] | [.id,
       (((((.pricing.prompt // 0)|tonumber)*1000000*1000|round)/1000)|f3),
       (((((.pricing.completion // 0)|tonumber)*1000000*1000|round)/1000)|f3),
       (((((.pricing.input_cache_read // 0)|tonumber)*1000000*1000|round)/1000)|f3)]]
      | sort_by(.[0])
      | .[]))
    | @tsv

openrouter.pricing:
  url: https://openrouter.ai/api/v1/models/$!MODELID/endpoints
  jq: |
    def pad: tostring | if length==1 then "00"+. elif length==2 then "0"+. else . end;
    def f3: (. * 1000 | round) as $m | (($m/1000)|floor) as $i | ($m % 1000) as $f | "\($i).\($f|pad)";
    (["provider/model","provider","prompt $/1M","completion $/1M","cache-read $/1M"],
     ([.data.endpoints[] | [.model_id, .provider_name,
        (((.pricing.prompt // 0)|tonumber)*1000000),
        (((.pricing.completion // 0)|tonumber)*1000000),
        (((.pricing.input_cache_read // 0)|tonumber)*1000000)]]
      | sort_by(.[0])
      | .[]
      | [.[0], .[1], (.[2]|f3), (.[3]|f3), (.[4]|f3)]))
    | @tsv
  help: |
    List all providers serving MODELID with their per-1M pricing.
    Columns: provider/model, provider, prompt $/1M, completion $/1M, cache-read $/1M.
searxng.search:
  url: $!SEARXNG_BASE_URL/search?q=$!QUERY&format=json
  help: Set up a server github.com/0x96f/searxng
tavily.search:
  url: https://api.tavily.com/search
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer $!TAVILY_API_KEY
  body: |
    { "query": "$!QUERY", "max_results": "3" }
  help: Set TAVILY_API_KEY in env. Get key at tavily.com.
turboff.chat:
  url: http://127.0.0.1:8080/v1/chat/completions
  method: POST
  headers:
    Content-Type: application/json
  body: |
   {
    "model": "gemma-4-26b-a4b-it",
    "messages": [{"role": "user", "content": "$!PROMPT"}],
    "temperature": 0,
    "max_completion_tokens": 10240
   }
  help: |
    Create a TurboFF chat completion. Requires API_KEY, MODEL, and PROMPT.

    Start the server locally using:
      swift build -c release --product TurboFieldfareServer
      .build/release/TurboFieldfareServer \
        --model scratch/gemma4.gturbo \
        --port 8080 \
        --max-context 16384
